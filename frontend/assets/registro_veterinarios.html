<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGEPOR - Veterinarios</title>
    <link rel="stylesheet" href="frontend/assets/css/style.css">
    <style>
        .auth-container {
            max-width: 500px;
            margin: 60px auto;
            padding: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            color: white;
        }

        .auth-container h2 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .auth-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            cursor: pointer;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .tab-btn.active {
            background: rgba(255, 255, 255, 0.4);
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .tab-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: slideIn 0.3s ease-in;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            background: rgba(255, 255, 255, 0.9);
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            background: white;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.3);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: rgba(255, 255, 255, 0.25);
            color: white;
            border: 2px solid white;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: white;
            color: #667eea;
            transform: translateY(-2px);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            display: none;
        }

        .message.success {
            background: rgba(76, 175, 80, 0.3);
            color: #c8e6c9;
            border: 2px solid rgba(76, 175, 80, 0.5);
        }

        .message.error {
            background: rgba(244, 67, 54, 0.3);
            color: #ffcdd2;
            border: 2px solid rgba(244, 67, 54, 0.5);
        }

        .message.show {
            display: block;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: white;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s;
        }

        .back-link:hover {
            transform: translateX(-5px);
        }

        .logo-auth {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-auth img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid white;
        }

        .logo-auth h3 {
            margin-top: 10px;
            font-size: 24px;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <nav class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <img src="logo.jpg" alt="SIGEPOR">
                </div>
                <h3>SIGEPOR</h3>
            </div>
            <ul>
                <li><a href="index.html">🏠 Inicio</a></li>
                <li><a href="registroporcino.html">🐷 Gestión Porcina</a></li>
                <li><a href="vacunas.html">🩺 Vacunas</a></li>
                <li><a href="registro_veterinarios.html" class="active">👨‍⚕️ Veterinarios</a></li>
                <li><a href="javascript:void(0)" onclick="openPanel('reports')">📊 Reportes</a></li>
                <li><a href="javascript:void(0)" onclick="openPanel('settings')">⚙️ Configuración</a></li>
                <li><a href="javascript:void(0)" onclick="cerrarSesion()">🔒 Cerrar Sesión</a></li>
            </ul>
        </nav>

        <section class="content">
            <div class="auth-container">
                <div class="logo-auth">
                    <img src="logo.jpg" alt="SIGEPOR">
                    <h3>Sistema Veterinario</h3>
                </div>

                <div class="auth-tabs">
                    <button class="tab-btn active" data-tab="login" onclick="switchTab('login', this)">🔐 Iniciar Sesión</button>
                    <button class="tab-btn" data-tab="register" onclick="switchTab('register', this)">📝 Registrarse</button>
                </div>

                <!-- PESTAÑA DE LOGIN -->
                <div id="login" class="tab-content active">
                    <h2>Iniciar Sesión</h2>
                    <form id="loginForm">
                        <div class="form-group">
                            <label for="loginUser">👤 Usuario:</label>
                            <input type="text" id="loginUser" placeholder="Ingrese su usuario" required>
                        </div>
                        <div class="form-group">
                            <label for="loginPassword">🔑 Contraseña:</label>
                            <input type="password" id="loginPassword" placeholder="Ingrese su contraseña" required>
                        </div>
                        <button type="submit" class="btn-submit">Iniciar Sesión</button>
                        <div id="loginMessage" class="message"></div>
                    </form>
                </div>

                <!-- PESTAÑA DE REGISTRO -->
                <div id="register" class="tab-content">
                    <h2>Crear Nueva Cuenta</h2>
                    <form id="registerForm">
                        <div class="form-group">
                            <label for="registerName">👨‍⚕️ Nombre Completo:</label>
                            <input type="text" id="registerName" placeholder="Nombre del veterinario" required>
                        </div>
                        <div class="form-group">
                            <label for="registerEmail">📧 Correo Electrónico:</label>
                            <input type="email" id="registerEmail" placeholder="correo@ejemplo.com" required>
                        </div>
                        <div class="form-group">
                            <label for="registerUser">👤 Usuario:</label>
                            <input type="text" id="registerUser" placeholder="Nombre de usuario único" required>
                        </div>
                        <div class="form-group">
                            <label for="registerPassword">🔑 Contraseña:</label>
                            <input type="password" id="registerPassword" placeholder="Mínimo 6 caracteres" required>
                        </div>
                        <div class="form-group">
                            <label for="registerPasswordConfirm">✓ Confirmar Contraseña:</label>
                            <input type="password" id="registerPasswordConfirm" placeholder="Confirme la contraseña" required>
                        </div>
                        <button type="submit" class="btn-submit">Registrarse</button>
                        <div id="registerMessage" class="message"></div>
                    </form>
                </div>

                <a href="index.html" class="back-link">← Volver al Inicio</a>
            </div>
        </section>
    </div>

    <script src="JS/script.js"></script>
    <script>
        // Cambiar entre pestañas
        function switchTab(tabName, button) {
            const tabs = document.querySelectorAll('.tab-content');
            const buttons = document.querySelectorAll('.tab-btn');
            
            tabs.forEach(tab => tab.classList.toggle('active', tab.id === tabName));
            buttons.forEach(btn => btn.classList.toggle('active', btn === button));
        }

        // MANEJO DE REGISTRO
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const name = document.getElementById('registerName').value.trim();
            const email = document.getElementById('registerEmail').value.trim();
            const user = document.getElementById('registerUser').value.trim();
            const password = document.getElementById('registerPassword').value;
            const passwordConfirm = document.getElementById('registerPasswordConfirm').value;
            const messageDiv = document.getElementById('registerMessage');

            if (!name || !email || !user || !password || !passwordConfirm) {
                showMessage(messageDiv, 'Todos los campos son obligatorios', 'error');
                return;
            }

            if (password.length < 6) {
                showMessage(messageDiv, 'La contraseña debe tener mínimo 6 caracteres', 'error');
                return;
            }

            if (password !== passwordConfirm) {
                showMessage(messageDiv, 'Las contraseñas no coinciden', 'error');
                return;
            }

            try {
                const response = await fetch('http://localhost:3001/api/veterinarios/registrar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre: name, email, usuario: user, contraseña: password })
                });

                const data = await response.json();

                if (response.ok) {
                    showMessage(messageDiv, '✓ Registro exitoso. Ahora puede iniciar sesión.', 'success');
                    this.reset();
                    setTimeout(() => {
                        switchTab('login', document.querySelector('.tab-btn[data-tab="login"]'));
                    }, 1200);
                } else {
                    showMessage(messageDiv, '✗ ' + (data.error || 'Error en el registro'), 'error');
                }
            } catch (error) {
                showMessage(messageDiv, '✗ Error de conexión. Asegúrate que el servidor está ejecutándose en el puerto 3001.', 'error');
            }
        });

        // MANEJO DE LOGIN
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const user = document.getElementById('loginUser').value.trim();
            const password = document.getElementById('loginPassword').value;
            const messageDiv = document.getElementById('loginMessage');

            try {
                const response = await fetch('http://localhost:3001/api/veterinarios/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario: user, contraseña: password })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('veterinarioActivo', JSON.stringify(data.veterinario));
                    
                    showMessage(messageDiv, '✓ Inicio de sesión exitoso. Redirigiendo...', 'success');
                    
                    setTimeout(() => {
                        window.location.href = 'vacunas.html';
                    }, 1500);
                } else {
                    showMessage(messageDiv, '✗ ' + (data.error || 'Usuario o contraseña incorrectos'), 'error');
                    document.getElementById('loginPassword').value = '';
                }
            } catch (error) {
                showMessage(messageDiv, '✗ Error de conexión. Asegúrate que el servidor está ejecutándose.', 'error');
            }
        });

        // Función para mostrar mensajes
        function showMessage(element, message, type) {
            if (!element) return;
            element.textContent = message;
            element.className = `message ${type} show`;
            
            setTimeout(() => {
                element.classList.remove('show');
            }, 4000);
        }

        // Verificar si ya hay una sesión activa
        window.addEventListener('load', function() {
            const veterinarioActivo = localStorage.getItem('veterinarioActivo');
            if (veterinarioActivo) {
                // Ya está logueado, redirigir a vacunas
                // window.location.href = 'vacunas.html';
            }
        });
    </script>
</body>
</html>
