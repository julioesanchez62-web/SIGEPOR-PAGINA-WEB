<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGEPOR - Registro de Datos</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="main-container">
        <nav class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <img src="images/logo.jpg" alt="SIGEPOR">
                </div>
                <h3>SIGEPOR</h3>
            </div>
            <ul>
                <li><a href="index.html">🏠 Inicio</a></li>
                
                
            </ul>
        </nav>

        <section class="content">
            <div class="page-header">
                <div class="header-icon">👤</div>
                <div class="header-content">
                    <h2>ACTUALIZACIÓN DE DATOS PERSONALES</h2>
                    <p>Mantén tu información de perfil actualizada y segura</p>
                </div>
            </div>

            <div class="card-wrapper">
                <form class="grid-form" id="formulario-usuarios">
   

    <div class="form-section-title">
        <span class="section-icon">📋</span>
        <h3>Información Básica</h3>
    </div>
     <!-- CAMPO OCULTO PARA EL ID DE USUARIO (Indispensable para Consultar/Actualizar/Borrar) -->
    <div class="field" style="grid-column: span 2;">
        <label>ID de Usuario (Para Consultar/Actualizar/Borrar):</label>
        <input type="number" id="input-id" placeholder="Ej: 1">
    </div>

  

    <div class="form-section-title" style="grid-column: span 2; margin-top: 20px;"></div>
       <div class="field">
        <label>Nombres y Apellidos:</label>
        <input type="text" id="input-nombre" placeholder="Ej: Juan Pérez" required>
    </div>

    <div class="field">
        <label>Correo Electrónico:</label>
        <input type="email" id="input-correo" placeholder="usuario@ejemplo.com">
    </div>
    <div class="field">
        <label>Usuario:</label>
        <input type="text" id="input-usuario" placeholder="usuario">
    </div>
     <div class="field">
        <label>Contraseña:</label>
        <input type="password" id="input-contrasena" placeholder="contraseña">
    </div>
    
    <div class="form-actions">
        <!-- Quitamos type="submit" para controlar el envío mediante JS de forma segura -->
        <button type="button" id="btn-guardar" class="btn-save">✓ GUARDAR CAMBIOS</button>
        <button type="reset" class="btn-reset">↻ LIMPIAR FORMULARIO</button>
        <button type="button" class="btn-consult" onclick="consultarUsuario()">🔍 CONSULTAR USUARIO</button>
        <button type="button" class="btn-update" onclick="actualizarUsuario()">✏️ ACTUALIZAR USUARIO</button>
        <button type="button" class="btn-delete" onclick="borrarUsuario()">🗑️ BORRAR USUARIO</button>
    </div>
</form>
              
            </div>

            <!-- Sección de consejos -->
            <div class="info-box">
                <div class="info-box-header">
                    <span class="info-icon">💡</span>
                    <h4>Consejo</h4>
                </div>
                <p>Mantener tus datos actualizados es importante para recibir notificaciones importantes sobre tu cuenta y granja.</p>
            </div>
        </section>
    </div>

    <script src="js/offline_sync.js"></script>
    <script src="js/script.js"></script>

    <script>
        const API_URL = 'http://localhost:3001/api/users';
        const LOCAL_KEY_USERS = 'sigeporUsuarios';

        const formulario = document.getElementById('formulario-usuarios');
        const btnGuardar = document.getElementById('btn-guardar');
        const inputId = document.getElementById('input-id');
        const inputNombre = document.getElementById('input-nombre');
        const inputCorreo = document.getElementById('input-correo');
        const inputUsuario = document.getElementById('input-usuario');
        const inputContrasena = document.getElementById('input-contrasena');

        // 🟢 LÓGICA DEL BOTÓN: GUARDAR CAMBIOS
        if (btnGuardar) {
            btnGuardar.addEventListener('click', async () => {
                const newId = inputId.value.trim() ? parseInt(inputId.value.trim(), 10) : Date.now();
                const datosUsuario = {
                    id: newId,
                    nombre: inputNombre.value.trim(),
                    correo: inputCorreo.value.trim(),
                    usuario: inputUsuario.value.trim(),
                    contraseña: inputContrasena.value,
                    idRol: 2
                };

                if (!datosUsuario.nombre || !datosUsuario.correo || !datosUsuario.contraseña) {
                    alert('Por favor, rellene todos los campos obligatorios antes de guardar.');
                    return;
                }

                try {
                    const response = typeof fetchConFallbackOffline === 'function'
                        ? await fetchConFallbackOffline(API_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(datosUsuario)
                        })
                        : await fetch(API_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(datosUsuario)
                        });

                    const resultado = await response.json();

                    // Caché optimista
                    const cached = JSON.parse(localStorage.getItem(LOCAL_KEY_USERS) || '[]');
                    cached.push(datosUsuario);
                    localStorage.setItem(LOCAL_KEY_USERS, JSON.stringify(cached));

                    if (response.ok || response.offline) {
                        alert('¡Éxito! ' + (resultado.message || 'Usuario guardado.'));
                        if (resultado.user && resultado.user.id) {
                            inputId.value = resultado.user.id;
                        }
                    } else {
                        alert('Error: ' + (resultado.message || 'No se pudo guardar el usuario.'));
                    }
                } catch (error) {
                    console.error(error);
                    const cached = JSON.parse(localStorage.getItem(LOCAL_KEY_USERS) || '[]');
                    cached.push(datosUsuario);
                    localStorage.setItem(LOCAL_KEY_USERS, JSON.stringify(cached));
                    alert('✓ Guardado en modo local.');
                }
            });
        }

        // 🔵 LÓGICA DEL BOTÓN: CONSULTAR USUARIO
        async function consultarUsuario() {
            const id = inputId.value.trim();
            if (!id) {
                alert('Por favor, ingrese un número de ID en el campo superior para buscar.');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/${id}`);
                if (response.ok) {
                    const resultado = await response.json();
                    const userObj = resultado.data || resultado;
                    inputNombre.value = userObj.nombre || '';
                    inputCorreo.value = userObj.correo || userObj.email || '';
                    inputUsuario.value = userObj.usuario || '';
                    inputContrasena.value = '';
                    alert('Datos cargados de forma exitosa desde la base de datos.');
                    return;
                }
            } catch (error) {
                console.warn('Buscando en caché local:', error);
            }

            const cached = JSON.parse(localStorage.getItem(LOCAL_KEY_USERS) || '[]');
            const userObj = cached.find(u => Number(u.id) === Number(id));
            if (userObj) {
                inputNombre.value = userObj.nombre || '';
                inputCorreo.value = userObj.correo || userObj.email || '';
                inputUsuario.value = userObj.usuario || '';
                inputContrasena.value = '';
                alert('Datos cargados desde el almacenamiento local.');
            } else {
                alert('⚠️ Usuario no encontrado.');
            }
        }

        // 🔵 LÓGICA DEL BOTÓN: ACTUALIZAR USUARIO
        async function actualizarUsuario() {
            const id = inputId.value.trim();
            if (!id) {
                alert('Se requiere especificar el ID del usuario que desea actualizar.');
                return;
            }

            const datosActualizados = {
                id: parseInt(id, 10),
                nombre: inputNombre.value.trim(),
                correo: inputCorreo.value.trim(),
                usuario: inputUsuario.value.trim(),
                contraseña: inputContrasena.value,
                idRol: 2
            };

            try {
                const response = typeof fetchConFallbackOffline === 'function'
                    ? await fetchConFallbackOffline(`${API_URL}/${id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(datosActualizados)
                    })
                    : await fetch(`${API_URL}/${id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(datosActualizados)
                    });

                const resultado = await response.json();

                const cached = JSON.parse(localStorage.getItem(LOCAL_KEY_USERS) || '[]');
                const idx = cached.findIndex(u => Number(u.id) === Number(id));
                if (idx >= 0) {
                    cached[idx] = { ...cached[idx], ...datosActualizados };
                    localStorage.setItem(LOCAL_KEY_USERS, JSON.stringify(cached));
                }

                if (response.ok || response.offline) {
                    alert('¡Datos de usuario modificados con éxito!');
                } else {
                    alert('Error al actualizar: ' + resultado.message);
                }
            } catch (error) {
                console.error(error);
                alert('Error en la red al intentar actualizar los datos.');
            }
        }

        // 🔴 LÓGICA DEL BOTÓN: BORRAR USUARIO
        async function borrarUsuario() {
            const id = inputId.value.trim();
            if (!id) {
                alert('Debe ingresar el ID del usuario que desea eliminar definitivamente.');
                return;
            }

            const confirmar = confirm(`¿Está seguro de eliminar al usuario con ID ${id}?`);
            if (!confirmar) return;

            try {
                const response = typeof fetchConFallbackOffline === 'function'
                    ? await fetchConFallbackOffline(`${API_URL}/${id}`, { method: 'DELETE' })
                    : await fetch(`${API_URL}/${id}`, { method: 'DELETE' });

                const resultado = await response.json();

                const cached = JSON.parse(localStorage.getItem(LOCAL_KEY_USERS) || '[]');
                const filtrados = cached.filter(u => Number(u.id) !== Number(id));
                localStorage.setItem(LOCAL_KEY_USERS, JSON.stringify(filtrados));

                if (response.ok || response.offline) {
                    alert(resultado.message || 'Usuario eliminado.');
                    if (formulario) formulario.reset();
                } else {
                    alert('Error al borrar: ' + resultado.message);
                }
            } catch (error) {
                console.error(error);
                const cached = JSON.parse(localStorage.getItem(LOCAL_KEY_USERS) || '[]');
                const filtrados = cached.filter(u => Number(u.id) !== Number(id));
                localStorage.setItem(LOCAL_KEY_USERS, JSON.stringify(filtrados));
                alert('🗑️ Usuario eliminado en modo local.');
                if (formulario) formulario.reset();
            }
        }
    </script>
</body>
</html>
